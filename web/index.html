<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mixtape</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/png" href="/static/mixtape.png">
  <link rel="apple-touch-icon" href="/static/mixtape.png">
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>Mixtape</h1>
          <p class="sub">Turn a YouTube playlist into a folder of 320&nbsp;kbps MP3s.</p>
        </div>
      </div>
      <div class="header-accent" aria-hidden="true"></div>
    </header>

    <div id="ffmpeg-warning" class="banner hidden">
      <strong>ffmpeg not found.</strong>
      Downloads will fail at the conversion step. Install it with
      <code>winget install Gyan.FFmpeg</code>, then restart this app.
    </div>

    <form id="job-form">
      <label for="url">Playlist URL</label>
      <input id="url" name="url" type="text" required
             placeholder="https://www.youtube.com/playlist?list=... or https://youtu.be/..."
             autocomplete="off" spellcheck="false">

      <label for="output">Save to folder</label>
      <input id="output" name="output" type="text" autocomplete="off" spellcheck="false">

      <div class="actions">
        <button id="fetch-btn" type="button">Fetch Tracks</button>
        <button id="start" type="submit" class="hidden">Start Download</button>
        <button id="cancel" type="button" class="secondary hidden">Cancel</button>
        <button id="back-btn" type="button" class="secondary hidden">Back</button>
        <span id="status" class="status"></span>
      </div>
    </form>

    <div id="error" class="banner error hidden"></div>

    <section id="selection" class="hidden">
      <div class="selection-head">
        <h2 id="selection-title"></h2>
        <div class="selection-actions">
          <button id="select-all" type="button" class="secondary">Select All</button>
          <button id="deselect-all" type="button" class="secondary">Deselect All</button>
        </div>
      </div>
      <ul id="selection-tracks"></ul>
      <div class="selection-footer">
        <span id="selection-count" class="status"></span>
        <button id="download-selected" type="button" disabled>Download Selected (<span id="selected-count">0</span>)</button>
      </div>
    </section>

    <section id="results" class="hidden">
      <div class="playlist-head">
        <h2 id="playlist-title"></h2>
        <span id="counts" class="counts"></span>
      </div>
      <ul id="tracks"></ul>
    </section>
  </main>

  <script src="/static/app.js?v=2"></script>
</body>
</html>
